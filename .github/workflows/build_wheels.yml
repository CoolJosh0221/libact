name: Build Wheels

on:
  push:
    tags: ['v*']  # Build wheels on version tags
    branches: [main, master]  # Also build on direct pushes to main/master
    paths:
      - '**.py'
      - '**.pyx'
      - 'pyproject.toml'
      - '**/meson.build'
      - 'meson.options'
      - '.github/workflows/build_wheels.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**.py'
      - '**.pyx'
      - 'pyproject.toml'
      - '**/meson.build'
      - 'meson.options'
      - '.github/workflows/build_wheels.yml'
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
        # ubuntu-latest: Linux x86_64 (native)
        # ubuntu-24.04-arm: Linux aarch64 (native, no QEMU!)
        # macos-15-intel: macOS Intel x86_64 (native)
        # macos-15: macOS Apple Silicon arm64 (native)

    steps:
      - uses: actions/checkout@v4

      # Set up ccache for faster C++ compilation
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-ccache

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD_VERBOSITY: 1
          # Build only native architecture (no cross-compilation or emulation)
          CIBW_ARCHS: native

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  windows_pure_wheel:
    name: Build & test pure-Python wheel on Windows
    # libact's compiled strategies (HintSVM, VarianceReduction) link BLAS/LAPACK
    # and have no Windows build. cibuildwheel keeps skipping "*-win*"; instead we
    # build a pure-Python (py3-none-any) wheel here with both C extensions
    # disabled, and verify it installs and imports cleanly, with the two
    # compiled strategies degrading to ExtensionUnavailable.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build pure-Python wheel (C extensions disabled)
        shell: bash
        run: |
          pipx run build --wheel \
            -Csetup-args="-Dhintsvm=false" \
            -Csetup-args="-Dvariance_reduction=false"

      - name: Verify wheel is pure-Python (py3-none-any)
        shell: bash
        run: |
          ls -l dist/
          if ls dist/*py3-none-any.whl >/dev/null 2>&1; then
            echo "✓ Built a pure-Python (py3-none-any) wheel"
          else
            echo "✗ ERROR: expected a py3-none-any wheel, got:"
            ls dist/
            exit 1
          fi

      - name: Upload Windows pure-Python wheel
        uses: actions/upload-artifact@v4
        with:
          # NOTE: the artifact name must NOT match "wheels-*". The test_wheels
          # and upload_testpypi jobs collect "wheels-*"; this pure wheel must
          # never reach an index, because a py3-none-any wheel would be selected
          # on every platform lacking a compiled wheel (musllinux, cp313, ...).
          name: windows-pure-wheel
          path: dist/*.whl
          retention-days: 7

      - name: Install the wheel and runtime dependencies
        shell: bash
        run: |
          pip install --find-links dist libact
          pip install numpy scipy scikit-learn matplotlib

      - name: Smoke test the pure-Python install
        shell: python
        run: |
          import libact
          print("libact version:", libact.__version__)

          import libact.query_strategies as qs  # must not raise
          from libact.base.dataset import Dataset
          from libact.base.exceptions import ExtensionUnavailable
          from libact.query_strategies import (
              HintSVM, VarianceReduction, UncertaintySampling,
          )
          from libact.models import LogisticRegression

          # A pure-Python strategy must work end to end.
          X = [[-2, -1], [1, 1], [-1, -2], [2, 1],
               [0, 1], [1, 0], [-1, 0], [0, -1]]
          y = [0, 1, 0, 1, None, None, None, None]
          ds = Dataset(X, y)
          us = UncertaintySampling(
              ds, model=LogisticRegression(solver="liblinear"))
          picked = us.make_query()
          assert picked in (4, 5, 6, 7), picked
          print("OK UncertaintySampling.make_query() ->", picked)

          # The two compiled strategies must degrade gracefully -- a clear
          # ExtensionUnavailable (an ImportError subclass), never "DLL load failed".
          for name, cls in [("HintSVM", HintSVM),
                            ("VarianceReduction", VarianceReduction)]:
              try:
                  cls(ds)
              except ExtensionUnavailable as exc:
                  assert isinstance(exc, ImportError)
                  msg = str(exc)
                  assert "Windows" in msg, msg
                  assert "DLL load failed" not in msg, msg
                  print("OK %s -> ExtensionUnavailable" % name)
              else:
                  raise AssertionError(
                      "%s should have raised ExtensionUnavailable" % name)
          print("OK Windows pure-Python smoke test passed")

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 7

  test_wheels:
    name: Test wheels
    needs: [build_wheels]
    # Run on: version tags, manual triggers, and re-runs (but NOT on regular branch pushes/PRs)
    if: github.event_name == 'workflow_dispatch' || github.run_attempt > 1 || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
        python: ['3.9', '3.12'] # Test oldest and newest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: wheelhouse

      - name: Install wheel and dependencies
        shell: bash
        run: |
          pip install --find-links wheelhouse libact
          pip install numpy scipy scikit-learn matplotlib

      - name: Test import and functionality
        shell: bash
        run: |
          python -c "import libact; print(f'libact version: {libact.__version__}')"
          python -c "
          import libact.query_strategies as qs

          # Test basic imports
          assert hasattr(qs, 'UncertaintySampling'), 'UncertaintySampling not found'
          assert hasattr(qs, 'RandomSampling'), 'RandomSampling not found'
          print('✓ Basic query strategies imported successfully')

          # These wheels are built on Linux/macOS with BLAS/LAPACK, so the
          # compiled extensions MUST be present. (The Windows pure-Python wheel
          # is built and tested separately in the windows_pure_wheel job.)
          import libact.query_strategies._hintsvm  # noqa: F401
          import libact.query_strategies._variance_reduction  # noqa: F401
          from libact.query_strategies import HintSVM, VarianceReduction  # noqa: F401
          print('✓ C-extension modules (HintSVM, VarianceReduction) available and working')
          "

  upload_testpypi:
    name: Upload to TestPyPI
    needs: [build_wheels, build_sdist, test_wheels]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/libact
    permissions:
      id-token: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Download sdist
        uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

